services:
  db:
    image: postgres:15-alpine
    container_name: riwimedicare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exam_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # PostgreSQL 5432 internal, 5436 exposed on host to avoid local instance
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-exam_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: riwimedicare-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${HOST_PORT:-3003}
      HOST_PORT: ${HOST_PORT:-3003}
      API_PREFIX: /api
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-exam_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_LOGGING: "false"
      DB_SYNC: "true"
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret-before-production-123456}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-4h}
      BCRYPT_ROUNDS: 10
      CORS_ORIGIN: "*"
    # Unified: internal and host use same HOST_PORT (default 3003)
    ports:
      - "${HOST_PORT:-3003}:${HOST_PORT:-3003}"

volumes:
  postgres_data:
